# Netlify build configuration.
# The site is connected to GitHub, so every push to `main` triggers a
# production deploy and every pull request gets a Deploy Preview.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serve index.html for any path that isn't a real file. The site uses hash
# routing (/#/classes), so this mainly keeps stray URLs from 404ing -- and it
# means switching to clean URLs later needs no further configuration.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
